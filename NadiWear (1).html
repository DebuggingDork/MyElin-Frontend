y, conversion, supply, cash. Output is set by the narrowest stage, not the average. Money spent on any other stage produces nothing until the narrow one moves. This is why improving something that is already comfortable can leave results completely unchanged."},health:{cat:"Orientation",title:"Health bars are orientation, not a score",body:"These are readings of the underlying variables, scaled to make them comparable at a glance. A low bar is not automatically a problem to fix \u2014 a young company should have some low bars. They exist so you notice what you have stopped looking at."},priority:{cat:"Judgment",title:"Declared strategy versus revealed strategy",body:"What a company is actually doing is visible in where its money goes, not in what its leadership says. Declaring a priority before you see the levers creates a record you can be held to. At the close, your stated priority, your actual spending and the company's real constraint are compared."},board:{cat:"Leadership",title:"Competing stakeholders",body:"The board wants growth, the CFO wants runway, customers want a better product, the team wants a sustainable workload. These cannot all be satisfied at once and none of them is automatically right. Management is the allocation of disappointment."},diminishing:{cat:"Marketing",title:"Diminishing returns are built into every channel",body:"Each channel follows a curve with an exponent below one \u2014 doubling spend produces well under double the leads. The first rupee in a channel is always worth more than the last. This is why spreading across channels usually beats concentrating in one, up to the point where each becomes too small to matter."},cac:{cat:"Marketing",title:"Cost per lead is not cost per customer",body:"A lead becomes a customer only if sales can work it and the product can close it. Divide acquisition spend by units actually sold, not by leads generated, and compare that with contribution per unit. If it exceeds contribution, growth is destroying value."},compounding:{cat:"Marketing",title:"Rented demand versus owned demand",body:"Paid acquisition stops the moment payment stops. Content, search and brand accumulate into an asset that generates leads in later quarters at no cost. Nearly everyone under-funds the second kind, because it shows no return in the quarter it is bought and the person who buys it may not be there to collect."},voice:{cat:"Marketing",title:"Share of voice",body:"Your standing in a category depends partly on being visible relative to competitors, not on absolute spend. Marketing raises position, but it cannot raise it on its own \u2014 price, product and availability all sit in the same calculation."},capacity:{cat:"Sales",title:"Selling capacity is a hard gate",body:"Leads beyond what the team can work are not stored, delayed or discounted. They are lost. This is the most common expensive mistake in the simulation: demand generation and selling capacity funded by different logic, in the same quarter, by the same person."},channel:{cat:"Sales",title:"Channel is capacity you rent",body:"Distributors add reach without hiring, and take a permanent margin on everything they touch. You also do not own the customer relationship, which shows up later in repeat purchase. Volume through a channel is worth less per unit than volume you sell yourself."},ceiling:{cat:"Product",title:"The conversion ceiling",body:"Sales effort, tools and training raise how well you can sell. The product decides how much of that can land. When raw selling capability exceeds the ceiling, the excess buys nothing at all \u2014 the money is spent and the units do not appear. Watch the gap between the two numbers, not either one alone."},capitalised:{cat:"Product",title:"Capitalised versus expensed",body:"Continuous R&D is an expense: it hits this quarter's profit and is gone. Innovation cards are capitalised: they become an asset on the balance sheet and are written down over time. The same rupee therefore affects profit, cash and net worth quite differently depending on which one you spend it on."},leadtime:{cat:"Product",title:"Lead times mean you are deciding for a later quarter",body:"Anything with a lead time is paid for now and arrives later. In a four-quarter year, a card started in the final quarter never ships and the money is simply gone. Product decisions are the ones with the longest gap between cause and effect."},npd:{cat:"Product",title:"Partial progress is worth nothing",body:"A new product either reaches the market or it does not. Development progress that stops at ninety is worth exactly as much as progress that stopped at ten. Committing to a second product is a multi-quarter commitment or it is waste."},pricing:{cat:"Product",title:"Price moves volume and margin in opposite directions",body:"Lower price lifts demand and lowers contribution per unit; higher price does the reverse. Neither is right. What matters is contribution per unit multiplied by units, against a cost base that does not move when you discount. A company can grow share and destroy value at the same time."},installed:{cat:"Operations",title:"Owning capacity is not running it",body:"Installed capacity is a permanent asset you paid for. The production run decides how much of it you switch on this quarter. Plant that is not run still depreciates and still sits on the balance sheet. Capacity investment without a matching run is the most expensive way to buy nothing."},inventory:{cat:"Operations",title:"Inventory is cash you have already spent",body:"Units built and not sold are money converted into a form you cannot use, which then costs more money to hold. Building to capacity rather than to demand is comfortable, invisible in profit for a while, and one of the fastest ways to run out of cash while appearing to grow."},yield:{cat:"Operations",title:"Losses compound before anything is sold",body:"What you build is reduced by supplier reliability, by staffing, by attrition and by any supply shock, multiplicatively. Four separate factors at ninety per cent leave you with sixty-six. Reliability is invisible until you look at the gap between what you funded and what appeared."},contract:{cat:"Operations",title:"Flexibility has a price",body:"Contract manufacturing needs no capital and can be turned on and off, which is exactly why it costs more per unit. It is the right answer for a spike and the wrong answer for a trend."},ramp:{cat:"People",title:"New hires do not arrive at full speed",body:"Someone hired this quarter contributes about sixty per cent of a full person, then full effect afterwards. The cost, however, starts immediately and continues every quarter thereafter. Hiring into a problem you have this quarter solves it next quarter."},staffing:{cat:"People",title:"Functions fail in different ways",body:"Being short in marketing throttles leads. Being short in operations throttles production. Being short in engineering means R&D delivers less than you paid for. The headcount total tells you nothing \u2014 only the split does."},attrition:{cat:"People",title:"People decisions are paid for later",body:"Cutting roles saves salary at once, and costs morale, engagement and higher attrition in the quarters that follow. You lose people you did not choose to lose. This is the clearest delayed consequence in the model."},workingcap:{cat:"Finance",title:"Profit is not cash",body:"Revenue is recognised when the sale happens; cash arrives when the customer pays. Between them sit receivable days. A company can be profitable and insolvent in the same quarter, and this is how it usually happens."},payables:{cat:"Finance",title:"Supplier terms are financing",body:"Paying later means your supplier funds part of your production, which shows as payables rather than as cash leaving. Paying earlier buys a discount and better reliability. Either can be right; the question is whether you need the cash more than the margin."},gearing:{cat:"Finance",title:"Borrow when you can, not when you must",body:"The facility is capped at a proportion of net worth, so it shrinks exactly as your position weakens. Credit is cheapest to arrange when you do not need it. The alternative is raising from a position of distress, which is priced accordingly."},compliance:{cat:"Finance",title:"Governance buys the absence of a problem",body:"Compliance and audit make no sale and appear only as a cost. Underfunding them raises a penalty risk that is charged against revenue every quarter. It is the clearest example of a cost whose value is only visible in what does not occur."},share:{cat:"Market",title:"Share is a result, not a goal",body:"Market share is your units sold as a proportion of what the whole category buys. It can be bought with price at the cost of margin, which is why share and profitability must always be read together. High share with weak economics is a worse position than the reverse."},position:{cat:"Market",title:"Position versus execution",body:"Your competitive position sets how much of the category's demand you could reach. What you actually sell is limited by capacity, supply and cash. The gap between the two is execution, and closing it is usually cheaper than improving position."},rivals:{cat:"Market",title:"Competitors do not stand still",body:"Rival strength grows every quarter whether you act or not. Holding share constant therefore requires continuous investment. A flat share line means you are running to stay in the same place, which is not the same as stagnation."},crisis:{cat:"Events",title:"A shock is a test of what you built earlier",body:"How much a market event costs depends on the state of the company when it arrives \u2014 innovation already shipped, supplier reliability already bought, cash already held. The response budget helps at the margin. The preparation, bought quarters earlier for no visible reason, matters more."},covenant:{cat:"Endgame",title:"Read the covenant, not the headline",body:"Investment terms attach conditions. A larger cheque with a harder target can be worth less than a smaller one you will meet. A ratchet on a miss transfers ownership at the worst possible moment. The number on the front page is the least informative part of a term sheet."},continuation:{cat:"Endgame",title:"Acquisition price versus continuation value",body:"An offer is worth taking only if it exceeds what the business would be worth if you kept running it. That comparison requires a view on your own momentum, which is the hardest number in the transaction to be honest about \u2014 and the one the buyer has already estimated."},reflection:{cat:"Judgment",title:"Naming the sacrifice",body:"Every allocation is a decision not to fund something else. A trade-off you can name is a decision; one you cannot is an oversight. Recording it before the outcome is known is the only way to tell the difference afterwards."},statements:{cat:"Finance",title:"Why three statements and not one",body:"The profit and loss shows performance, the cash flow shows solvency, and the balance sheet shows position. They are reconciled but not interchangeable, and the balance sheet must balance: assets always equal liabilities plus equity."}};function ot({id:e,inline:t}){let n=d.default.useContext(F6),[r,a]=(0,d.useState)(!1),i=cv[e];return!n||!i?null:d.default.createElement("div",{className:t?"mt-2":"mt-3"},d.default.createElement("button",{onClick:()=>a(!r),className:"text-xs uppercase tracking-widest font-semibold text-stone-500 hover:text-rose-800 border-b border-dotted border-stone-400"},r?"Hide note":"Why this works this way"),r&&d.default.createElement("div",{className:"mt-2 border-l-2 border-stone-800 bg-stone-50 px-3 py-2"},d.default.createElement("div",{className:"text-xs uppercase tracking-widest text-rose-800 font-semibold"},i.cat),d.default.createElement("div",{className:"font-serif text-base text-stone-900 mt-0.5"},i.title),d.default.createElement("p",{className:"text-sm text-stone-700 mt-1 leading-snug"},i.b
